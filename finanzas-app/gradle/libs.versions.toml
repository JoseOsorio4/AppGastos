[versions]
agp = "9.1.1"
# Debe ser la misma versión que <version> en finanzas-core/pom.xml.
finanzasCore = "0.2.0"
appcompat = "1.7.1"
room = "2.8.5"
# KSP genera el código de Room; desde 2.3 su versión ya no depende de la de Kotlin.
ksp = "2.3.12"
desugarJdkLibs = "2.1.5"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
finanzas-core = { group = "gt.edu.umg.finanzas", name = "finanzas-core", version.ref = "finanzasCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# room-ktx ya no hace falta: desde Room 2.7 withTransaction vive en room-runtime.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
